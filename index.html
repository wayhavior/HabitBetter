<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Better</title>
    <!-- Google Sign-In Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google API Library -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <!-- Firebase Initialization -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js-compat"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js-compat"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app"></div>

    <!-- โหลด script.js ให้เรียบร้อยก่อน Google APIs -->
    <script src="./script.js"></script>

    <!-- รอให้ page โหลดจบแล้วเรียก initialization -->
    <script>
        // เรียกใช้เมื่อ page โหลดจบ
        window.addEventListener('load', function() {
            // ให้เวลา Google APIs โหลด
            setTimeout(() => {
                if (typeof initializeGoogleDriveAPI === 'function') {
                    initializeGoogleDriveAPI();
                    console.log('✓ Google Drive API initialized');
                } else {
                    console.warn('⚠️ initializeGoogleDriveAPI not ready yet');
                }
            }, 500);

            // Service Worker registration
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✓ Service Worker registered!'))
                    .catch(err => console.log('⚠️ Service Worker registration failed: ', err));
            }
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('firebase-messaging-sw.js')
                    .then(registration => console.log('✅ Firebase Service Worker registered'))
                    .catch(error => console.warn('⚠️ Firebase Service Worker registration failed:', error));
            }
        });
    </script>
</body>
</html>
