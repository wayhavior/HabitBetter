<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Better</title>
    
    <!-- Google Sign-In Library (v1) - ต้องมี async defer -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Google API Library -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="app"></div>

    <!-- โหลด script.js ให้เรียบร้อยก่อน Google APIs -->
    <script src="./script.js"></script>

    <!-- รอให้ page โหลดจบแล้วเรียก initialization -->
    <script>
        // เรียกใช้เมื่อ page โหลดจบ
        window.addEventListener('load', function() {
            console.log('📄 Page loaded, initializing Google APIs...');
            
            // ให้เวลา Google APIs โหลด (1 วินาที)
            setTimeout(() => {
                // 1️⃣ Initialize Google Sign-In ก่อน
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    try {
                        google.accounts.id.initialize({
                            client_id: "192099173031-arqdd6koquej0is89egvmna3bg7j552m.apps.googleusercontent.com",
                            callback: handleGoogleLogin,
                            ux_mode: 'popup',
                            auto_select: false
                        });
                        console.log('✓ Google Sign-In initialized successfully');
                    } catch(e) {
                        console.error('✗ Google Sign-In init error:', e);
                    }
                } else {
                    console.warn('⚠️ Google Sign-In library not ready yet');
                }
                
                // 2️⃣ Initialize Google Drive API
                if (typeof initializeGoogleDriveAPI === 'function') {
                    initializeGoogleDriveAPI();
                    console.log('✓ Google Drive API initialized');
                } else {
                    console.warn('⚠️ initializeGoogleDriveAPI function not ready yet');
                }
            }, 1000);

            // 3️⃣ Service Worker registration
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✓ Service Worker registered!'))
                    .catch(err => console.log('⚠️ Service Worker registration failed: ', err));
            }
        });
    </script>
</body>
</html>
